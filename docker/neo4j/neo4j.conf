# Neo4j 5 configuration for TransitOps development

server.default_listen_address=0.0.0.0
server.bolt.listen_address=0.0.0.0:7687
server.http.listen_address=0.0.0.0:7474

server.memory.heap.initial_size=512m
server.memory.heap.max_size=1G
server.memory.pagecache.size=512m

server.security.auth_enabled=true

# Allow APOC procedures
server.security.procedures.unrestricted=apoc.*
server.security.procedures.allowlist=apoc.*

# Transaction limits
db.transaction.timeout=60s

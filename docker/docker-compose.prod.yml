services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  neo4j:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

  analytics:
    restart: always
    environment:
      PYTHON_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  neo4j:
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: transitops-backend
    restart: unless-stopped
    networks:
      - transitops-network
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-transitops}:${POSTGRES_PASSWORD:-transitops_dev}@postgres:5432/${POSTGRES_DB:-transitops}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-transitops_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  analytics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analytics
    container_name: transitops-analytics
    restart: unless-stopped
    networks:
      - transitops-network
    ports:
      - "${ANALYTICS_PORT:-8000}:8000"
    volumes:
      - ../analytics:/app
    environment:
      PYTHON_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-transitops}:${POSTGRES_PASSWORD:-transitops_dev}@postgres:5432/${POSTGRES_DB:-transitops}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-transitops_dev}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: transitops-frontend
    restart: unless-stopped
    networks:
      - transitops-network
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api/v1}
      NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
